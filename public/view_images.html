<!DOCTYPE html>
<html>
<head>
  <title>View Extracted Images</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #121212;
      color: white;
      padding: 20px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }
    .card {
      border: 1px solid #333;
      padding: 10px;
      border-radius: 8px;
      background: #1e1e1e;
    }
    img {
      max-width: 100%;
      height: auto;
      border-radius: 4px;
      border: 1px solid #444;
    }
    h3 {
      margin-top: 0;
    }
  </style>
</head>
<body>
  <h1>Extracted Screenshots</h1>
  <div class="grid">
    <div class="card">
      <h3>Screenshot 1</h3>
      <img src="manual_images/screenshot_1.png">
    </div>
    <div class="card">
      <h3>Screenshot 2</h3>
      <img src="manual_images/screenshot_2.png">
    </div>
    <div class="card">
      <h3>Screenshot 3</h3>
      <img src="manual_images/screenshot_3.png">
    </div>
    <div class="card">
      <h3>Screenshot 4</h3>
      <img src="manual_images/screenshot_4.png">
    </div>
    <div class="card">
      <h3>Screenshot 5</h3>
      <img src="manual_images/screenshot_5.png">
    </div>
    <div class="card">
      <h3>Screenshot 6</h3>
      <img src="manual_images/screenshot_6.png">
    </div>
    <div class="card">
      <h3>Screenshot 7</h3>
      <img src="manual_images/screenshot_7.png">
    </div>
    <div class="card">
      <h3>Screenshot 8</h3>
      <img src="manual_images/screenshot_8.png">
    </div>
    <div class="card">
      <h3>Screenshot 9</h3>
      <img src="manual_images/screenshot_9.png">
    </div>
    <div class="card">
      <h3>Screenshot 10</h3>
      <img src="manual_images/screenshot_10.png">
    </div>
  </div>
</body>
</html>
